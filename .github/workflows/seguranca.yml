# Análise estática de segurança (Aula 20.2) e fuzzing (Aula 20.3). A análise roda a cada push
# e pull request, e toda segunda: uma vulnerabilidade nova aparece na base do Go sem que o
# código mude. O fuzzing roda só na segunda (ou à mão).
name: seguranca

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * 1" # segunda, 05:17 em Porto Velho
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analise:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: scripts/seguranca.sh

  # Fuzzing (Aula 20.3): só no agendamento e à mão, 1 minuto por alvo. Uma entrada que
  # quebra um alvo sobe como artefato do job; copie-a para o testdata/fuzz/ do pacote.
  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: FUZZTIME=1m scripts/fuzz.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-achados
          path: "**/testdata/fuzz/"
