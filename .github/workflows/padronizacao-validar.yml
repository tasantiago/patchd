name: padronizacao-validar
on:
  push:
    branches: [feat/padronizacao-computadores]
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Formatar arquivos Go
        run: |
          git ls-files -z '*.go' | xargs -0 gofmt -w
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add '*.go'
            git commit -m 'style: formatar padronização'
            git push
          fi
      - name: Atualizar matriz de rotas
        run: |
          go test ./internal/api -run '^TestMatrizDeRotas$' -update
          if ! git diff --quiet; then
            git add docs/rotas.md
            git commit -m 'docs: atualizar matriz de rotas da padronização'
            git push
          fi
