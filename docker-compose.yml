# Ambiente de desenvolvimento do patchd.
# Subir:  docker compose up -d --build
# Entrar: docker compose exec dev zsh
# O compose de produção (servidor + Postgres) fica em deploy/, Aula 1.4.
services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: patchd-dev
    init: true
    volumes:
      - .:/home/appuser/app
      - ./.docker/zsh/powerlevel10k/.p10k.zsh:/home/appuser/.p10k.zsh
      - ./.docker/zsh/history:/home/appuser/zsh
      - gomod:/home/appuser/go
      - gobuild:/home/appuser/.cache/go-build
      - ${HOME}/.gitconfig:/home/appuser/.gitconfig:ro
      - ${SSH_AUTH_SOCK:-/dev/null}:/ssh-agent
    environment:
      SSH_AUTH_SOCK: /ssh-agent
    ports:
      - "8081:8080"
    restart: unless-stopped

volumes:
  gomod:
  gobuild: