# Ambiente de desenvolvimento do patchd.
# Subir:  docker compose up -d --build
# Entrar: docker compose exec dev zsh
# O compose de produção (servidor + Postgres) fica em deploy/ e usa o projeto "patchd".
# Nome próprio: evita que um compose trate os containers do outro como órfãos.
name: patchd-dev

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: patchd-dev
    init: true
    volumes:
      - .:/home/appuser/app
      - ./.docker/zsh/powerlevel10k/.p10k.zsh:/home/appuser/.p10k.zsh
      - ./.docker/zsh/history:/home/appuser/zsh
      - ./.docker/ssh:/home/appuser/.ssh
      - gomod:/home/appuser/go
      - gobuild:/home/appuser/.cache/go-build
      - ${HOME}/.gitconfig:/home/appuser/.gitconfig:ro
      - ${SSH_AUTH_SOCK:-/dev/null}:/ssh-agent
    environment:
      SSH_AUTH_SOCK: /ssh-agent
    # Só na interface local do host: o servidor de desenvolvimento não fica exposto na rede.
    # Porta do host ajustável pelo .env (PATCHD_DEV_PORT), padrão 18080, para não disputar a 8080.
    ports:
      - "127.0.0.1:${PATCHD_DEV_PORT:-18080}:8080"
    restart: unless-stopped

volumes:
  gomod:
  gobuild:
